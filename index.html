<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AniHancer8</title>
  <style>
    :root{--bg:#08070f;--panel:#100c1c;--line:#33204d;--text:#f3edff;--muted:#b9a9d2;--accent:#8b4dff;--accent2:#b47cff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 0,#1c0d33 0,transparent 34%),radial-gradient(circle at 100% 100%,#160a2b 0,transparent 32%),var(--bg);color:var(--text);display:grid;place-items:center;padding:28px}
    main{width:min(860px,100%);background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 26px 80px rgba(0,0,0,.4)}
    .brand{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);font-weight:800}.logo{font-size:42px;margin:10px 0 8px}.logo span{color:var(--accent2)}p{color:var(--muted);line-height:1.7;max-width:720px}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:12px 16px;border-radius:12px;background:#130d22;font-weight:700}a.primary{background:linear-gradient(135deg,#6d31d8,#9b5cff);border-color:#9b5cff}footer{margin-top:30px;color:#7f7198;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="brand">Official project pages</div>
    <div class="logo">AniHancer<span>8</span></div>
    <p>AniHancer8 is a local browser video-enhancement extension. These public pages provide the project's privacy policy and uninstall information used for Chrome Web Store publication.</p>
    <div class="links">
      <a class="primary" href="privacy.html">Privacy Policy</a>
      <a href="uninstall.html">Uninstall Information</a>
    </div>
    <footer>© 2026 ALK-8 · AniHancer8</footer>
  </main>
</body>
</html>
